version: '3.8'

services:
  nards_db_backup:
    image: nards/nards-db-backup:latest
    build: .
    environment:
      DB_HOST: 'database'
      DB_PORT: '5432' # postgres/postgis: 5432; mysql: 3306; graphdb: 7200; mongodb: 27017; redis: 6379
      DB_USER: 'user'
      DB_PASSWORD: 'password'
      DB_TYPE: 'postgres' # postgres/postgis/mysql/graphdb/mongodb/redis
      BACKUP_DIR: /backups
      CRON_CONFIGS: '[{"cron": "0 * * * *", "retention_max": 15, "name": "every"},{"cron": "0 * * * *", "retention_max": 1, "name": "hourly"}]'
      # RESTORE_CONFIG_NAME: 'hourly'
    volumes:
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock # Required for Redis module to use 'docker cp' if container_name is specified
